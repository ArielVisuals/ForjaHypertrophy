<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sin conexión — FORJA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      background: #0A0A0B;
      color: white;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center bottom, rgba(37,99,235,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 360px;
    }

    .logo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .icon-offline {
      width: 48px;
      height: 48px;
      color: rgba(255,255,255,0.3);
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      line-height: 1;
    }

    p {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.6;
      font-weight: 500;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 0.5rem 1rem;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    button {
      width: 100%;
      padding: 1rem 2rem;
      border-radius: 1rem;
      border: 1px solid rgba(37,99,235,0.4);
      background: rgba(37,99,235,0.15);
      color: #93c5fd;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: rgba(37,99,235,0.25);
      border-color: rgba(37,99,235,0.6);
    }

    button:active { transform: scale(0.98); }

    .forja-brand {
      font-size: 0.65rem;
      font-weight: 900;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.12);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="content">
    <div class="logo-wrap">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="6" x2="23" y2="6"/>
        <line x1="1" y1="18" x2="23" y2="18"/>
        <line x1="8" y1="2" x2="8" y2="22"/>
        <line x1="16" y1="2" x2="16" y2="22"/>
      </svg>
    </div>

    <div class="pill">
      <span class="dot"></span>
      Sin conexión
    </div>

    <div>
      <h1>No hay red</h1>
    </div>

    <p>
      FORJA necesita conexión para sincronizar tus datos de entrenamiento. 
      Revisa tu Wi-Fi o datos móviles e inténtalo de nuevo.
    </p>

    <button onclick="retry()">
      ↻ Reintentar conexión
    </button>

    <p class="forja-brand">FORJA Hypertrophy</p>
  </div>

  <script>
    function retry() {
      window.location.reload();
    }

    // Auto-retry cuando recupera conexión
    window.addEventListener('online', () => {
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
